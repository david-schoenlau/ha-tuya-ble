[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyrtuya_ble"
version = "0.0.1"
description = "Talk to Tuya BLE devices directly from Python on Linux/Raspberry Pi."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "David Schoenlau" }]
dependencies = [
    "bleak>=0.21",
    "bleak-retry-connector>=3.5",
    "pycryptodomex>=3.18",
    "aiohttp>=3.9",
]

[project.scripts]
pyrtuya-ble = "pyrtuya_ble.cli:main"

[tool.setuptools.packages.find]
include = ["pyrtuya_ble*"]
